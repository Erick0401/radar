<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Tabasco</title>
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-caja">
      <div class="login-logo" aria-hidden="true"><span></span></div>
      <h1>Radar Tabasco</h1>
      <p>Escribe tu clave de acceso</p>
      <form id="form-login">
        <label for="clave" class="oculto">Clave</label>
        <input id="clave" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" required>
        <button type="submit" class="btn btn-primario">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </div>

  <div id="app" hidden>
    <!-- Vista Mapa (persistente) -->
    <section id="v-mapa" class="vista">
      <header class="cabecera">
        <div class="fila">
          <div>
            <div class="marca">Radar Tabasco</div>
            <div class="estado"><span id="punto-estado" class="punto"></span><span id="txt-estado">Conectando…</span></div>
          </div>
          <div class="acciones-cab">
            <button id="btn-refrescar" class="btn-icono" aria-label="Actualizar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button id="btn-menu" class="btn-icono" aria-label="Menú">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
            </button>
          </div>
        </div>
        <div class="kpis">
          <div class="kpi rojo"><b id="k-rojo">–</b><span>Urgentes</span></div>
          <div class="kpi naranja"><b id="k-naranja">–</b><span>Atención</span></div>
          <div class="kpi amarillo"><b id="k-amarillo">–</b><span>Seguimiento</span></div>
        </div>
        <div id="aviso-noche" class="aviso" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          Modo nocturno: solo suenan las alertas rojas
        </div>
        <button id="aviso-push" class="aviso aviso-push" hidden></button>
      </header>

      <div class="cuerpo-mapa">
        <div class="col-mapa">
        <div class="modos" role="tablist" aria-label="Modo del mapa">
          <button role="tab" data-modo="alertas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Alertas</button>
          <button role="tab" data-modo="iconos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Íconos</button>
          <button role="tab" data-modo="riesgo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Riesgo</button>
          <button role="tab" data-modo="sismos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2-6 3 12 3-9 2 3h6"/></svg>Sismos</button>
          <button role="tab" data-modo="clima"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Clima</button>
        </div>

        <div class="mapa-caja">
          <div id="mapa"></div>
          <div class="capas">
            <button id="btn-lluvia" class="chip-capa" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><path d="M8 19v2M12 17v4M16 19v2"/></svg>Radar de lluvia
            </button>
          </div>
          <div id="leyenda" class="leyenda"></div>
        </div>

        <div id="modo-info" class="modo-info" hidden></div>
        </div>

        <div class="lista-caja">
          <div class="fila lista-cab">
            <div>
              <div id="titulo-dia" class="titulo-dia">Hoy</div>
              <div id="sub-dia" class="sub">—</div>
            </div>
            <label class="btn btn-sec btn-fecha">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span>Elegir fecha</span>
              <input id="fecha" type="date" aria-label="Elegir fecha">
            </label>
          </div>
          <div class="filtros">
            <button class="chip activo" data-filtro="todas">Todas</button>
            <button class="chip" data-filtro="urgentes">Solo urgentes</button>
            <select id="filtro-cat" class="chip" aria-label="Categoría"><option value="">Categoría</option></select>
            <button id="chip-muni" class="chip activo" hidden></button>
            <button id="btn-hoy" class="chip" hidden>Volver a hoy</button>
          </div>
          <div id="lista" class="lista"></div>
        </div>
      </div>
    </section>

    <!-- Vistas dinámicas -->
    <section id="v-otra" class="vista" hidden></section>

    <nav id="tabs" class="tabs" aria-label="Secciones">
      <a href="#/mapa" data-tab="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</a>
      <a href="#/lectura" data-tab="lectura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Lectura</a>
      <a href="#/agenda" data-tab="agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</a>
      <a href="#/actores" data-tab="actores"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg>Actores</a>
    </nav>
  </div>

  <div id="menu" class="hoja-menu" hidden>
    <div class="hoja-menu-caja" role="dialog" aria-label="Menú">
      <div id="menu-usuario" class="sub"></div>
      <button id="m-push" class="btn btn-sec">Activar notificaciones</button>
      <a class="btn btn-sec" href="#/tv">Modo pantalla de monitoreo (TV)</a>
      <button id="m-salir" class="btn btn-sec">Cerrar sesión</button>
      <button id="m-cerrar" class="btn btn-primario">Cerrar</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
